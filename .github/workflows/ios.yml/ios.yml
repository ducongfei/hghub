name: iOS unsigned build

# Push 鍒?main 鍗宠窇锛涗篃鍙湪 Actions 椤垫墜鍔ㄨ窇銆?on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ios.yml
      - src/**
      - src-tauri/**
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

jobs:
  ios:
    name: iOS (unsigned .ipa)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install xcodegen + CocoaPods
        run: |
          brew install xcodegen || true
          pod --version || sudo gem install cocoapods

      - run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Generate iOS Xcode project
        run: pnpm tauri ios init --ci

      - name: Build unsigned .app
        run: |
          set -euo pipefail
          cd src-tauri/gen/apple
          xcodebuild -project HGhub.xcodeproj -scheme HGhub \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="
          ls -lh build/Build/Products/Release-iphoneos/

      - name: Package unsigned .ipa
        run: |
          set -euo pipefail
          APP=src-tauri/gen/apple/build/Build/Products/Release-iphoneos/HGhub.app
          test -d $APP
          rm -rf Payload HGhub-unsigned.ipa
          mkdir -p Payload
          cp -R $APP Payload/
          zip -r -y HGhub-unsigned.ipa Payload
          ls -lh HGhub-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: HGhub-ios-unsigned
          path: HGhub-unsigned.ipa
          if-no-files-found: error
