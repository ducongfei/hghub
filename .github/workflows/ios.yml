name: iOS unsigned build

# Push 到 main 即跑；也可在 Actions 页手动跑。
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios.yml"
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

jobs:
  ios:
    name: iOS (unsigned .ipa)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install xcodegen + CocoaPods
        run: |
          brew install xcodegen || true
          pod --version || sudo gem install cocoapods

      - run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Generate iOS Xcode project
        run: pnpm tauri ios init --ci

      - name: Discover Xcode scheme
        id: scheme
        working-directory: src-tauri/gen/apple
        run: |
          xcodebuild -list -project huangguo-client.xcodeproj | tee scheme-list.txt
          SCHEME=$(xcodebuild -list -project huangguo-client.xcodeproj | awk '/Schemes:/{flag=1;next} flag && NF{print $1; exit}')
          if [ -z "$SCHEME" ]; then echo "no scheme found in xcodebuild -list output"; exit 1; fi
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Found scheme: $SCHEME"

      - name: Build unsigned .app
        run: |
          set -euo pipefail
          cd src-tauri/gen/apple
          xcodebuild -project huangguo-client.xcodeproj -scheme ${{ steps.scheme.outputs.scheme }} \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          ls -lh build/Build/Products/Release-iphoneos/

      - name: Locate built .app
        id: app
        run: |
          APP=$(find src-tauri/gen/apple/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then echo "no .app built"; exit 1; fi
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "Built app: $APP"

      - name: Package unsigned .ipa
        run: |
          set -euo pipefail
          APP="${{ steps.app.outputs.app }}"
          test -d "$APP"
          rm -rf Payload HGhub-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r -y HGhub-unsigned.ipa Payload
          ls -lh HGhub-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: HGhub-ios-unsigned
          path: HGhub-unsigned.ipa
          if-no-files-found: error
